[project]
name = "spacetraders-backend"
version = "0.1.0"
description = "Stateless Python backend for the SpaceTraders agent-login web client"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "urllib3==2.3.0",
]

[project.optional-dependencies]
test = [
    "pytest==8.3.4",
    "hypothesis==6.123.2",
    "httpx==0.28.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
