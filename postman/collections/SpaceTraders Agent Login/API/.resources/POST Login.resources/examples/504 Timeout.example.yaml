$kind: http-example
name: '504 Timeout'
order: 4000
request:
  url: '{{base_url}}/api/login'
  method: POST
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "token": "eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9.example-valid-token"
      }
response:
  statusCode: 504
  statusText: Gateway Timeout
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "error": {
          "kind": "timeout",
          "message": "The request to the SpaceTraders API timed out."
        }
      }
