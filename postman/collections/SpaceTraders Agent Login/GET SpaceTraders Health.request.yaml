$kind: http-request
name: 'GET SpaceTraders Health'
method: GET
url: '{{base_url}}/health/spacetraders'
order: 2000
examples: './.resources/GET SpaceTraders Health.resources/examples'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200 or 503", function () {
        pm.expect([200, 503]).to.include(pm.response.code);
      });

      pm.test("Response body status matches the code", function () {
        const json = pm.response.json();
        pm.expect(json.status).to.equal(pm.response.code === 200 ? "ok" : "error");
      });
