name: Local Development
values:
  - key: base_url
    value: 'http://127.0.0.1:8000'
    description: Base URL of the locally running FastAPI backend (make run / scripts/run.ps1)
  - key: agent_token
    value: '{{vault:json_web_token_1dkw}}'
    description: Your SpaceTraders API bearer token — paste it here before sending requests
  - key: system_symbol
    value: 'X1-DF55'
    description: System symbol used by the waypoint requests (first two segments of a waypoint symbol)
  - key: waypoint_symbol
    value: 'X1-DF55-20250Z'
    description: Waypoint symbol used by GET Waypoint (for example your agent headquarters)
